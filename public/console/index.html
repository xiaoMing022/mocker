<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Server Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Mock Server Console</h1>
        <p class="subtitle">管理项目启停、端口与上游转发</p>
      </div>
      <div class="header-actions">
        <button type="button" id="refresh-btn" class="btn btn-ghost">刷新</button>
      </div>
    </header>

    <main>
      <section class="banner" id="global-message" hidden></section>
      <section id="projects" class="projects" aria-live="polite">
        <p class="muted">加载中…</p>
      </section>
    </main>

    <footer class="footer">
      <span>配置文件：<code>config/projects.json</code></span>
      <span>保存后自动热重载对应项目实例</span>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
